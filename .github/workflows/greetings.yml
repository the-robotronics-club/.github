name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to Robotronics Club, IIT Mandi—thank you for your first contribution; a maintainer will review your issue and get back to you soon."
        pr-message: "Welcome to Robotronics Club, IIT Mandi—thank you for your first pull request; a maintainer will review your contribution and get back to you soon."
